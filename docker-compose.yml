# docker-compose.yml
services:
  nextjs:
    build:
      context: .
      args:
        - DATABASE_URL=file:/app/prisma/dev.db
        - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
        - NEXTAUTH_URL=http://2fa.local
        - NODE_ENV=production
      dockerfile: Dockerfile
    container_name: multi_authenticator-nextjs
    ports:
      - "3000:3000"
    volumes:
      - type: bind
        source: ./.env.prod
        target: /app/.env # app is located at /app in the container
    tty: true
    stdin_open: true
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nextjs
    restart: unless-stopped
